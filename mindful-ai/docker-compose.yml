version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: mindful_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mindful_ai
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: mindful_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emotion-service:
    build:
      context: ./emotion-service
      dockerfile: Dockerfile
    container_name: mindful_emotion
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./emotion-service/.env
    environment:
      - PORT=8000
      - ENV=production
      - ALLOWED_ORIGINS=http://backend:5000
    volumes:
      - emotion_models:/root/.deepface/weights
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindful_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/mindful_ai
      - REDIS_URL=redis://redis:6379
      - EMOTION_SERVICE_URL=http://emotion-service:8000
      - LLM_PRIMARY=claude
      - STREAM_ENABLED=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindful_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api

volumes:
  mongodb_data:
  redis_data:
  emotion_models:
  gemma_adapter:
